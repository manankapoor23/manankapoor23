name: Refresh stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate assets/stats.svg
        run: python3 tools/stats-svg.py
        env:
          # public contribution data, so the default job token is enough;
          # swap in a PAT with read:user if GitHub ever tightens that
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet assets/stats.svg && exit 0
          git commit -qm "Refresh stats [skip ci]" assets/stats.svg
          git push
